name: validate

# Triggers:
#   - pull_request: validate before merge into main
#   - push: tags: resolve and validate the released plugin (release.mjs creates
#     the GitHub Release only if this authoritative tag-CI run succeeds)
#   - workflow_dispatch: manual run for ad-hoc validation

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - '*--v*'   # any <plugin>--v<version> release tag (docks--v*, plan-lifecycle--v*, ...)
  workflow_dispatch:

# Least privilege: every validation job is read-only.
permissions:
  contents: read

jobs:
  resolve-shards:
    name: "resolve validation shards"
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.shards.outputs.lanes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Depth 1 cannot resolve the commit literals some checks pin.
          fetch-depth: 0
      - name: "setup Node 24"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: "start hosted step timing"
        run: |
          printf '{"step":"start hosted step timing","at_ms":%s,"job":"%s","run_id":"%s","run_attempt":"%s","runner_os":"%s","runner_arch":"%s"}\n' "$(date +%s%3N)" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "resolve validation shards from the pull request diff"
        id: shards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # FAIL OPEN TO THE FULL GATE, NEVER TO NOTHING. This `if` is the decision
          # point: only a base commit that exists, shares a merge base with HEAD, and
          # yields a diff git actually produced may narrow the matrix. Every other
          # path - missing base SHA, force-pushed or grafted history, a shallow
          # clone, a git failure - takes the `--unresolved` branch and runs every
          # shard. `ci-target.mjs shards` fails open the same way on any internal
          # error, and it derives lanes from the plugin registry rather than from a
          # list duplicated here, so a new plugin cannot go ungated by omission.
          # Do not invert this default: a skipped shard must only ever be the result
          # of a positive, successful determination that nothing it owns changed,
          # because the opposite failure is silent and severe - a green pull request
          # that gated none of its own changes.
          CHANGED="$RUNNER_TEMP/docks-changed-paths.txt"
          if [ -n "$BASE_SHA" ] \
            && git rev-parse --verify --quiet "$BASE_SHA^{commit}" > /dev/null \
            && git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null 2>&1 \
            && git -c core.quotePath=false diff --name-only "$BASE_SHA...$HEAD_SHA" > "$CHANGED"; then
            node scripts/ci-target.mjs shards --event pull_request --changed-paths "$CHANGED" --github-output "$GITHUB_OUTPUT"
          else
            node scripts/ci-target.mjs shards --unresolved --github-output "$GITHUB_OUTPUT"
          fi
          printf '{"step":"resolve validation shards from the pull request diff","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "publish hosted timing artifact"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docks-hosted-timings-resolve-shards
          path: |
            ${{ runner.temp }}/docks-hosted-timings.jsonl
            ${{ runner.temp }}/docks-ci-timings.json
          if-no-files-found: warn

  validation-shards:
    name: "validation shard (${{ matrix.lane }})"
    if: github.event_name == 'pull_request'
    needs: [resolve-shards]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Registry-derived, resolved per pull request by the resolve-shards job.
        # Always contains the `repo` shard; `core` appears only when the diff
        # implicates a plugin it owns, or when resolution failed open.
        lane: ${{ fromJSON(needs.resolve-shards.outputs.lanes) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Depth 1 cannot resolve the commit literals some checks pin.
          fetch-depth: 0
      - name: "setup Node 24"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: "setup Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: "start hosted step timing"
        run: |
          # A stamped step's duration is its stamp minus the preceding stamp.
          printf '{"step":"start hosted step timing","at_ms":%s,"job":"%s","run_id":"%s","run_attempt":"%s","runner_os":"%s","runner_arch":"%s"}\n' "$(date +%s%3N)" "${GITHUB_JOB}-${{ matrix.lane }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "cache Bun install cache"
        id: bun-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: "mark hosted cache restore"
        run: |
          printf '{"step":"mark hosted cache restore","at_ms":%s,"bun_cache_hit":"%s","bun_cache_key":"%s"}\n' "$(date +%s%3N)" '${{ steps.bun-cache.outputs.cache-hit }}' '${{ steps.bun-cache.outputs.cache-primary-key }}' >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "install Bun dependencies (--frozen-lockfile; yaml + lockfile-pinned claude-code)"
        run: |
          bun install --frozen-lockfile
          printf '{"step":"install Bun dependencies (--frozen-lockfile; yaml + lockfile-pinned claude-code)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "verify registry signatures (non-blocking)"
        continue-on-error: true
        run: |
          status=0
          npm audit signatures || status=$?
          printf '{"step":"verify registry signatures (non-blocking)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
          exit "$status"
      - name: "materialize claude-code binary (trustedDependencies denies it by default)"
        run: |
          node node_modules/@anthropic-ai/claude-code/install.cjs
          printf '{"step":"materialize claude-code binary (trustedDependencies denies it by default)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "add node_modules/.bin to PATH (so ci.mjs finds the pinned claude)"
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          printf '{"step":"add node_modules/.bin to PATH (so ci.mjs finds the pinned claude)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "run validation lane"
        run: |
          node scripts/ci.mjs --lane "${{ matrix.lane }}" --timings-json "$RUNNER_TEMP/docks-ci-timings.json"
          printf '{"step":"run validation lane","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "publish hosted timing artifact"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docks-hosted-timings-validation-shards-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/docks-hosted-timings.jsonl
            ${{ runner.temp }}/docks-ci-timings.json
          if-no-files-found: warn

  targeting-contracts:
    name: "CI plugin-targeting contracts"
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: "setup Node 24"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: "setup Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: "start hosted step timing"
        run: |
          printf '{"step":"start hosted step timing","at_ms":%s,"job":"%s","run_id":"%s","run_attempt":"%s","runner_os":"%s","runner_arch":"%s"}\n' "$(date +%s%3N)" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "cache Bun install cache"
        id: bun-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: "mark hosted cache restore"
        run: |
          printf '{"step":"mark hosted cache restore","at_ms":%s,"bun_cache_hit":"%s","bun_cache_key":"%s"}\n' "$(date +%s%3N)" '${{ steps.bun-cache.outputs.cache-hit }}' '${{ steps.bun-cache.outputs.cache-primary-key }}' >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "install Bun dependencies (--frozen-lockfile; yaml + lockfile-pinned claude-code)"
        run: |
          bun install --frozen-lockfile
          printf '{"step":"install Bun dependencies (--frozen-lockfile; yaml + lockfile-pinned claude-code)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "verify registry signatures (non-blocking)"
        continue-on-error: true
        run: |
          status=0
          npm audit signatures || status=$?
          printf '{"step":"verify registry signatures (non-blocking)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
          exit "$status"
      - name: "materialize claude-code binary (trustedDependencies denies it by default)"
        run: |
          node node_modules/@anthropic-ai/claude-code/install.cjs
          printf '{"step":"materialize claude-code binary (trustedDependencies denies it by default)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "add node_modules/.bin to PATH (so ci.mjs finds the pinned claude)"
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          printf '{"step":"add node_modules/.bin to PATH (so ci.mjs finds the pinned claude)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "run non-unit plugin-targeting contracts"
        run: |
          node scripts/tests/ci-plugin-targeting.mjs
          printf '{"step":"run non-unit plugin-targeting contracts","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "publish hosted timing artifact"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docks-hosted-timings-targeting-contracts
          path: |
            ${{ runner.temp }}/docks-hosted-timings.jsonl
            ${{ runner.temp }}/docks-ci-timings.json
          if-no-files-found: warn

  validate:
    name: "validate (scripts/ci.mjs)"
    runs-on: ubuntu-latest
    needs: [validation-shards, targeting-contracts, resolve-shards]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: "setup Node 24"
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: "setup Bun"
        if: github.event_name != 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: resolve CI target
        id: target
        if: github.event_name == 'push'
        run: node scripts/ci-target.mjs release-tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: "start hosted step timing"
        if: github.event_name != 'pull_request'
        run: |
          printf '{"step":"start hosted step timing","at_ms":%s,"job":"%s","run_id":"%s","run_attempt":"%s","runner_os":"%s","runner_arch":"%s"}\n' "$(date +%s%3N)" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "cache Bun install cache"
        id: bun-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: "mark hosted cache restore"
        if: github.event_name != 'pull_request'
        run: |
          printf '{"step":"mark hosted cache restore","at_ms":%s,"bun_cache_hit":"%s","bun_cache_key":"%s"}\n' "$(date +%s%3N)" '${{ steps.bun-cache.outputs.cache-hit }}' '${{ steps.bun-cache.outputs.cache-primary-key }}' >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "install Bun dependencies (--frozen-lockfile; yaml + lockfile-pinned claude-code)"
        if: github.event_name != 'pull_request'
        run: |
          bun install --frozen-lockfile
          printf '{"step":"install Bun dependencies (--frozen-lockfile; yaml + lockfile-pinned claude-code)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "verify registry signatures (non-blocking)"
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          status=0
          npm audit signatures || status=$?
          printf '{"step":"verify registry signatures (non-blocking)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
          exit "$status"
      - name: "materialize claude-code binary (trustedDependencies denies it by default)"
        if: github.event_name != 'pull_request'
        run: |
          node node_modules/@anthropic-ai/claude-code/install.cjs
          printf '{"step":"materialize claude-code binary (trustedDependencies denies it by default)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "add node_modules/.bin to PATH (so ci.mjs finds the pinned claude)"
        if: github.event_name != 'pull_request'
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          printf '{"step":"add node_modules/.bin to PATH (so ci.mjs finds the pinned claude)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "run the authoritative gate (scripts/ci.mjs)"
        if: github.event_name != 'pull_request'
        run: |
          # A release-tag push carries the version bump that edited the repo-wide
          # `.claude-plugin/marketplace.json`, and it is the only run those bytes ever get:
          # the bump goes straight to `main`, which this workflow does not trigger on, and
          # the targeted `--plugin` gate skips every repo-wide phase by design. So the push
          # leg runs the repo-wide shard too — once, here, over the exact bytes being
          # released — and the targeted plugin gate still has the last word.
          if [ "${{ github.event_name }}" = "push" ]; then
            DOCKS_CI_MEMO=0 node scripts/ci.mjs --lane repo
            node scripts/ci.mjs --plugin "${{ steps.target.outputs.plugin }}" --timings-json "$RUNNER_TEMP/docks-ci-timings.json"
          else
            node scripts/ci.mjs --timings-json "$RUNNER_TEMP/docks-ci-timings.json"
          fi
          printf '{"step":"run the authoritative gate (scripts/ci.mjs)","at_ms":%s}\n' "$(date +%s%3N)" >> "$RUNNER_TEMP/docks-hosted-timings.jsonl"
      - name: "publish hosted timing artifact"
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docks-hosted-timings-validate
          path: |
            ${{ runner.temp }}/docks-hosted-timings.jsonl
            ${{ runner.temp }}/docks-ci-timings.json
          if-no-files-found: warn
      - name: assert successful prerequisite jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_SHARDS_RESULT: ${{ needs.validation-shards.result }}
          TARGETING_CONTRACTS_RESULT: ${{ needs.targeting-contracts.result }}
          # A prerequisite must hold exactly its required result for this event;
          # `skipped` is a pass only where the job's own `if:` makes it legitimate.
          # resolve-shards and validation-shards are pull-request-only and
          # targeting-contracts runs on everything but push, so the required result
          # is a function of the event and nothing else. Accepting `skipped`
          # unconditionally is a green pull request with no shard having run at all
          # (an empty resolver matrix reports the shard job as skipped), so an
          # unlisted event fails rather than defaulting to permissive.
          RESOLVE_SHARDS_RESULT: ${{ needs.resolve-shards.result }}
        run: |
          status=0
          case "$EVENT_NAME" in
            pull_request) EXPECT_RESOLVE=success; EXPECT_SHARDS=success; EXPECT_TARGETING=success ;;
            push) EXPECT_RESOLVE=skipped; EXPECT_SHARDS=skipped; EXPECT_TARGETING=skipped ;;
            workflow_dispatch) EXPECT_RESOLVE=skipped; EXPECT_SHARDS=skipped; EXPECT_TARGETING=success ;;
            *) echo "unrecognised event name: $EVENT_NAME" >&2; exit 1 ;;
          esac
          require() {
            if [ "$3" != "$2" ]; then
              echo "$1 on $EVENT_NAME: expected $2, observed $3" >&2
              status=1
            fi
          }
          require resolve-shards "$EXPECT_RESOLVE" "$RESOLVE_SHARDS_RESULT"
          require validation-shards "$EXPECT_SHARDS" "$VALIDATION_SHARDS_RESULT"
          require targeting-contracts "$EXPECT_TARGETING" "$TARGETING_CONTRACTS_RESULT"
          exit "$status"
